spring:
  profiles:
    active: local
  application:
    name: lgk-ai-code-service-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lgk_ai_code_service
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      # 过期时间
      ttl: 3600
      database: 0
  # rabbitmq
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    virtual-host: /
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: 123456
  # 文件上传：默认单文件上限 1MB，手机直出照片普遍 3~5MB 会被直接拒收，
  # 故放宽到 10MB。服务端会先压缩到 1600px/JPEG 再存 MinIO 与送 VL 识别
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.lgk.lgkaicodeservice.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
      max-tokens: 8192
      max-retries: 3
#      strict-json-schema: true
#      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <Your API Key>
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: true
      log-responses: true


# 对象存储配置
storage:
  minio:
    endpoint: http://localhost:9000
    access-key: admin
    secret-key: 12345678
    bucket: lgk-ai-code-service
    # 文件大小限制：1MB = 1048576 字节
    max-file-size-bytes: 1048576

# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>

# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wan2.2-t2i-flash
  # 单词拍照录入用的多模态视觉模型（手写便利贴识别）
  vl-model: qwen3-vl-plus

# Canal 配置
canal:
  host: localhost
  port: 11111
  destination: example
  username: ""
  password: ""
  subscribe: "lgk_ai_code_service.post"
  batch-size: 1000
  enabled: true
  sleep-time: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
